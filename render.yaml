services:
  - type: web
    name: m-service-desk-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://frontend-nu-six-46.vercel.app,http://localhost:5173
      - key: FRONTEND_APP_URL
        value: https://frontend-nu-six-46.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
